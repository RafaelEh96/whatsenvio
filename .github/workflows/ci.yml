name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Architecture tests
        run: dotnet test tests/WhatsEnvio.ArchitectureTests --no-build --configuration Release

      - name: Unit tests
        run: dotnet test tests/WhatsEnvio.UnitTests --no-build --configuration Release

      - name: Integration tests
        run: dotnet test tests/WhatsEnvio.IntegrationTests --no-build --configuration Release

  images:
    name: images (${{ matrix.image }})
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: whatsenvio-api
            dockerfile: src/WhatsEnvio.Api/Dockerfile
          - image: whatsenvio-worker
            dockerfile: src/WhatsEnvio.Worker/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Resolve lowercase registry namespace
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record digest in job summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo
            echo "Referência imutável para deploy:"
            echo
            echo '```'
            echo "ghcr.io/${{ env.OWNER }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
