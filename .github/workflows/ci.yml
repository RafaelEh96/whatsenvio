name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Architecture tests
        run: dotnet test tests/WhatsEnvio.ArchitectureTests --no-build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/WhatsEnvio.UnitTests --no-build --configuration Release

      - name: Integration tests
        run: dotnet test tests/WhatsEnvio.IntegrationTests --no-build --configuration Release
